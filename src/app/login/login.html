<div class="login-page">
  <header class="logo">
    <img src="/axians-logo.png" alt="Axians logo">
  </header>

  <main class="login-card">
    <div class="login-heading">
      <h1>Welcome Back!</h1>
      <p>Enter your email and password to access your account.</p>
    </div>

    <form (ngSubmit)="login()" #loginForm="ngForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required email>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password"
          placeholder="Enter your password" required minlength="6">

        <label>
          <input type="checkbox" [(ngModel)]="showPassword" name="showPassword">
          Show password
        </label>
      </div>

      <p *ngIf="message" class="error">{{ message }}</p>

      <button type="submit" class="login-button" [disabled]="loginForm.invalid">
        Log In
      </button>
    </form>
  </main>
</div>
